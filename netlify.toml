[build]
command = "pip install -r requirements.txt && python manage.py collectstatic --noinput"
functions = "netlify/functions"
publish = "staticfiles"

[build.environment]
PYTHON_VERSION = "3.11"
PYTHONUNBUFFERED = "1"
DJANGO_SETTINGS_MODULE = "config.settings"

[[redirects]]
from = "/*"
to = "/.netlify/functions/django"
status = 200

[[redirects]]
from = "/static/*"
to = "/static/:splat"
status = 200

[[redirects]]
from = "/media/*"
to = "/media/:splat"
status = 200
